eight:800;opacity:.8}.ring{width:120px;height:120px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#b6f6cb var(--progress,0%),#ffffff34 0);z-index:1}.ring-inner{width:95px;height:95px;background:#086d52;border-radius:50%;display:grid;place-items:center;text-align:center}.ring-inner strong{font-size:26px;display:block}.ring-inner span{font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:18px}.card{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 2px 12px #0b423308}.metric label{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}.metric strong{font-size:25px;letter-spacing:-.6px}.metric small{color:var(--muted);display:block;margin-top:6px;font-size:11px}.section{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-top:18px}.section.equal{grid-template-columns:1fr 1fr}.card h3{font-size:17px;margin:0 0 7px}.sub{font-size:12px;color:var(--muted);margin:0 0 17px;line-height:1.5}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted)}.habit{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef2ef;font-size:13px}.habit:last-child{border:0}.habit label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1}.habit input[type=checkbox]{accent-color:var(--green);height:18px;width:18px}.tag{border-radius:100px;background:var(--soft);color:var(--forest);font-size:11px;font-weight:700;padding:5px 8px}.tag.warn{background:#fff2df;color:var(--warn)}.progress{height:8px;background:#edf1ef;border-radius:99px;overflow:hidden;margin:10px 0}.progress>span{height:100%;display:block;background:#119b73;border-radius:99px}.timeline{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #edf1ef}.timeline:last-child{border:0}.datebox{min-width:56px;border:1px solid var(--border);border-radius:10px;text-align:center;padding:8px 4px;color:var(--forest);font-size:12px;font-weight:800}.timeline b{font-size:13px}.timeline p{font-size:12px;color:var(--muted);margin:5px 0}.heading{font-size:23px;margin:0 0 6px;letter-spacing:-.5px}.intro{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 19px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.control,textarea,select{background:white;border:1px solid #cddbd3;border-radius:10px;padding:11px;color:#193e32;min-width:0}.toolbar label{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:11px;background:var(--green);color:white;padding:11px 15px;font-weight:750;font-size:13px}.btn.secondary{background:#ecf5f0;color:var(--forest)}.btn.outline{background:white;border:1px solid var(--border);color:var(--forest)}.btn.danger{background:#fff1f1;color:#ad3535}.form-row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.form-row>*{flex:1}.field{display:flex;flex-direction:column;gap:6px;min-width:110px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}td,th{border-bottom:1px solid #e8eee9;padding:12px 9px}td b{font-weight:650}td:last-child,th:last-child{text-align:right}.notice{background:#fff7e9;color:#835313;border:1px solid #f1dfb7;padding:12px 15px;border-radius:12px;font-size:12px;line-height:1.6;margin:12px 0}.success{background:#e9f7ef;color:#1b6743;border:1px solid #bfdfca}.mini{font-size:11px;color:var(--muted);line-height:1.5}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dayhead{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:5px}.day{border:1px solid var(--border);background:white;border-radius:10px;min-height:54px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:12px;color:#36483e}.day.selected{border:2px solid var(--green);background:var(--soft)}.day.completed{background:#d8f5e5}.day.off{opacity:.32}.day .dot{font-size:10px;color:var(--green)}.checkline{display:flex;gap:8px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.footer{margin-top:26px;font-size:11px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#1a3c31;color:white;padding:12px 18px;border-radius:11px;box-shadow:0 12px 30px #0003;z-index:50;max-width:90%;display:none}.bottom{display:none}.study-card{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ef;align-items:flex-start}.study-card input{accent-color:var(--green);margin-top:4px}.study-card b{font-size:13px}.study-card small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}.statsbar{display:flex;gap:5px;align-items:end;height:90px;margin:12px 0}.statsbar>div{flex:1;background:#e2f1e8;border-radius:5px 5px 0 0;min-height:4px}.statsbar>div.filled{background:#158769}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.privacy{font-size:12px;color:var(--muted);line-height:1.6}
.hourrow{display:grid;grid-template-columns:56px 1fr;gap:10px;border-bottom:1px solid #eef2ef;padding:9px 0}.hourtime{font-size:12px;color:var(--muted);font-weight:750;padding-top:8px}.slot{border:1px solid var(--border);border-left:4px solid var(--green);background:#fafdfa;border-radius:10px;padding:9px 11px;margin-bottom:5px;font-size:13px}.slot.prayer{border-left-color:#c48e20;background:#fffdf5}.slot.study{border-left-color:#3979b8}.slot.sleep{border-left-color:#9376c5}.slot strong{font-size:12px}.slot small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.slot-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.slot-controls button{font-size:11px;padding:5px 8px}.praygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prayercard{border:1px solid var(--border);border-radius:13px;padding:13px}.prayercard h4{margin:0 0 8px}.dhikr-item{padding:13px 0;border-bottom:1px solid #eef2ef}.dhikr-item .arabic{font-family:serif;font-size:21px;direction:rtl;line-height:1.9;text-align:right;padding:5px 0}.emptyhour{font-size:12px;color:#97a59f;padding:8px}.notehelp{font-size:11px;line-height:1.6;color:var(--muted)}@media(max-width:650px){.praygrid{grid-template-columns:1fr}.slot-controls select{max-width:100%}.hourrow{grid-template-columns:43px 1fr}.bottom{overflow-x:auto;justify-content:flex-start;gap:2px}.bottom button{flex:1;min-width:48px;font-size:9px}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section,.section.equal{grid-template-columns:1fr}.hero h2{font-size:24px}.shell{padding:16px 14px 100px}}@media(max-width:600px){.tabs{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid var(--border);padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:30}.bottom button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:5px 2px;min-width:52px}.bottom button.active{color:var(--green)}.bottom button span{display:block;font-size:19px;padding-bottom:4px}.top{padding:4px 0 16px}.hero{padding:22px 18px}.hero h2{font-size:22px}.hero p{font-size:12px}.ring{width:82px;height:82px}.ring-inner{width:64px;height:64px}.ring-inner strong{font-size:19px}.ring-inner span{font-size:8px}.metric strong{font-size:20px}.card{padding:16px}.grid{gap:9px}.brand h1{font-size:19px}.pill{font-size:10px;padding:7px 9px}}
.n90grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:12px 0}.n90day{padding:8px 2px;background:#f4f7f5;border:1px solid #dce7e1;border-radius:7px;font-size:12px}.n90day.selected{background:#e5f5ed;color:#086747;border-color:#8fcbae}.n90day small{display:block;font-size:12px}@media(max-width:600px){.n90grid{grid-template-columns:repeat(6,minmax(0,1fr))}}

<body>
<main class="shell">
<header class="top"><div class="brand"><div class="logo">90</div><div><h1>My 90 Days</h1><small>Life Transformation · Somali Edition</small></div></div><span id="topDate" class="pill"></span></header>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<section id="dashboard" class="view active"></section><section id="habits" class="view"></section><section id="schedule" class="view"></section><section id="study" class="view"></section><section id="finance" class="view"></section><section id="health" class="view"></section><section id="n90" class="view"></section><section id="settings" class="view"></section>
<div class="footer">My 90 Days · Xogtaadu waxay ku kaydsan tahay browser-ka qalabkaaga. Samee backup joogto ah.</div>
</main><nav class="bottom" id="bottom" aria-label="Mobile navigation"></nav><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const START='2026-11-12',END='2027-02-09',TOTAL=90; const TABS=[['dashboard','⌂','Dashboard'],['habits','✓','Habits'],['schedule','◷','Jadwal'],['study','▤','Study'],['finance','$','Daymo'],['health','♡','Health'],['n90','◇','N90'],['settings','⚙','Settings']];
const HABITS=[['prayers','Salaadaha iyo cibaadada','Cibaado'],['quran','Qur’aan: xizbi/juz','Cibaado'],['adhkar','Adhkaar subax/galab & dikri','Cibaado'],['movement','Socod / jimicsi guriga','Caafimaad'],['food','Cunto dheellitiran','Caafimaad'],['water','Cabitaanka biyo ku filan','Caafimaad'],['sleep','Hurdo iyo habeen deggan','Caafimaad'],['course','Semester course revision','Waxbarasho'],['reexam','Re-exam revision','Waxbarasho'],['thesis','Thesis / proposal work','Waxbarasho'],['money','Diiwaangelinta kharashyada','Maaliyad'],['reading','Akhris / documentary / reflection','Nolosha']];
const EVENTS=[['2026-11-21','Chapter 1 submission','La xaqiijiyey sawirka jaamacadda','thesis'],['2026-12-05','Chapter 2 submission','La xaqiijiyey sawirka jaamacadda','thesis'],['2026-12-20','Chapter 3 submission','La xaqiijiyey sawirka jaamacadda','thesis'],['2027-01-02','Final proposal submission','La xaqiijiyey sawirka jaamacadda','thesis']];
const COURSES=[['Spatial Analysis','Sabti','16:00–19:00'],['Machine Learning for Medical Statistics','Axad','16:00–19:00'],['Survival Analysis','Isniin','16:00–19:00']];
const EXAMS=['Regression Modelling','Inferential Statistics','ANOVA and Experimental Designs','Time Series Analysis','Introduction to Data Science'];
const stateDefault=()=>({version:1,habits:{},studied:{},logs:{},payments:[],expenses:[],income:[],debts:[],profile:{weight:83,height:177,age:27,openingDebt:8379,sleepTarget:'7–9 saacadood',sleepNow:'',goalWeight:79.5},notes:'',userEvents:[],prayerLogs:{},adhkarLogs:{},dailySchedule:{},quranSessions:[],readingSessions:[],n90:{},n90PinHash:""});
let db=load(),active='dashboard',selected=START,month='2026-11';
function load(){try{const raw=JSON.parse(localStorage.getItem('my90days-v1'));return raw&&raw.version===1?{...stateDefault(),...raw,profile:{...stateDefault().profile,...raw.profile}}:stateDefault()}catch(e){return stateDefault()}}
function save(){try{localStorage.setItem('my90days-v1',JSON.stringify(db))}catch(e){toast('Kaydintu way fashilantay: hubi browser storage.')}}
function parseDay(d){return new Date(d+'T12:00:00Z')}function plusDay(d,n){let x=parseDay(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}function diffDays(a,b){return Math.round((parseDay(a)-parseDay(b))/86400000)}function fmt(d){return new Intl.DateTimeFormat('so-SO',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(parseDay(d))}function isoToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayNum(d){return diffDays(d,START)+1}function inChallenge(d){return d>=START&&d<=END}function fast(d){let dow=parseDay(d).getUTCDay();return dow===1||dow===4}function money(v){return '$'+Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sum(arr,key='amount'){return arr.reduce((s,x)=>s+Number(x[key]||0),0)}function balance(){return Math.max(0,Number(db.profile.openingDebt||0)-sum(db.payments))}function pct(n,total){return total?Math.round(100*n/total):0}function checked(d,id){return !!db.habits[d]?.[id]}
function count(d){let count=HABITS.filter(x=>checked(d,x[0])).length;return {count,total:HABITS.length+(fast(d)?1:0),fastDone:fast(d)&&checked(d,'fast')}}function completion(d){let c=count(d);return pct(c.count+(c.fastDone?1:0),c.total)}function metric(label,value,detail){return `<div class="card metric"><label>${label}</label><strong>${value}</strong><small>${detail||''}</small></div>`}
function toast(message){let t=document.getElementById('toast');t.textContent=message;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',3300)}
function nav(){let make=(mobile)=>TABS.map(([id,ico,name])=>`<button class="${mobile?'':'tab '}${active===id?'active':''}" data-tab="${id}" ${active===id?'aria-current="page"':''}>${mobile?`<span>${ico}</span>`:''}${name}</button>`).join('');document.getElementById('tabs').innerHTML=make(false);document.getElementById('bottom').innerHTML=make(true);document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>show(e.dataset.tab))}
function show(tab){active=tab;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===tab));nav();render();window.scrollTo({top:0,behavior:'smooth'})}
function dayInfo(){const t=isoToday();let num=Math.min(TOTAL,Math.max(0,dayNum(t)));return {num,daysLeft:Math.max(0,diffDays(END,t)),today:t}}
function upcoming(){const t=isoToday();return [...EVENTS,...db.userEvents.map(x=>[x.date,x.title,x.note||'Adiga ayaa geliyey','custom'])].filter(e=>e[0]>=t).sort((a,b)=>a[0].localeCompare(b[0])).slice(0,5)}
function dashboard(){const di=dayInfo(),d=inChallenge(di.today)?di.today:START;let cs=count(d), done=cs.count+(cs.fastDone?1:0),prog=completion(d);const last7=Array.from({length:7},(_,i)=>plusDay(d,i-6));let nextFast=Array.from({length:8},(_,i)=>plusDay(di.today,i)).find(fast);document.getElementById('dashboard').innerHTML=`
<div class="hero"><div><div class="eyebrow">90-day personal transformation</div><h2>${di.num===0?'Berri ayaad bilaabaysaa!':di.num>=90?'Challenge-ka waa dhammaaday!':`Day ${di.num} of 90 · Sii wad!`}</h2><p>12 November 2026 — 9 February 2027</p><p>Thesis • Imtixaanno • Cibaado • Caafimaad • Maaliyad</p></div><div class="ring" style="--progress:${prog}%"><div class="ring-inner"><div><strong>${prog}%</strong><span>Maanta</span></div></div></div></div>
<div class="grid">${metric('Maalin ka harsan',di.daysLeft,'Dhamaadka: 9 Feb 2027')}${metric('Habits maanta',`${done}/${cs.total}`,'Diiwaanka maalinlaha ah')}${metric('Dayn harsan',money(balance()),'Bilow: $8,379')}${metric('Miisaankii ugu dambeeyey',`${lastWeight()} kg`,'Bilow: 83 kg')}</div>
<div class="section"><div class="card"><div class="between"><h3>Hawlaha maanta</h3><button class="btn secondary" onclick="show('habits')">Fur tracker →</button></div><p class="sub">Guji tracker-ka si aad u calaamadiso waxyaabaha aad qabatay.</p>${HABITS.slice(0,7).map(([id,label])=>`<div class="habit"><label><input type="checkbox" ${checked(d,id)?'checked':''} onchange="toggleHabit('${d}','${id}',this.checked)"><span>${label}</span></label></div>`).join('')}${fast(d)?`<div class="habit"><label><input type="checkbox" ${checked(d,'fast')?'checked':''} onchange="toggleHabit('${d}','fast',this.checked)">Soon Isniin/Khamiis</label><span class="tag">Soon</span></div>`:''}</div>
<div class="card"><h3>Deadlines & reminders</h3><p class="sub">Taariikhaha la xaqiijiyey iyo kuwa aad adigu ku darto.</p>${upcoming().map(([date,title,note])=>`<div class="timeline"><div class="datebox">${new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(parseDay(date))}</div><div><b>${esc(title)}</b><p>${esc(note)}</p></div></div>`).join('')||'<p class="muted">Ma jiraan deadlines la diiwaangeliyey oo soo socda.</p>'}<div class="notice">Semester exams, re-exams iyo proposal defense: <b>January 2027</b>; ma jiraan maalmo rasmi ah oo la xaqiijiyey.</div><p class="mini">Soonka xiga: <b>${fmt(nextFast||di.today)}</b></p></div></div>
<div class="section equal"><div class="card"><h3>7-dii maalmood ee u dambeeyey</h3><p class="sub">Dhamaystirka caadooyinka maalinlaha ah</p><div class="statsbar">${last7.map(x=>`<div class="${completion(x)>0?'filled':''}" style="height:${Math.max(4,completion(x))}%" title="${x}: ${completion(x)}%"></div>`).join('')}</div><div class="legend">${last7.map(x=>`<span>${parseDay(x).getUTCDate()}</span>`).join('')}</div></div><div class="card"><h3>Jadwalka fasallada</h3><p class="sub">Amoud University · Year II</p>${COURSES.map(([c,day,h])=>`<div class="timeline"><div class="datebox">${day}</div><div><b>${c}</b><p>${h}</p></div></div>`).join('')}<p class="mini">Isniinta soonka: qorshee afur haddii uu fasalka ku soo beegmo.</p></div></div>`}
function lastWeight(){let logs=Object.entries(db.logs).filter(([d,v])=>v.weight!==undefined&&v.weight!==''&&Number(v.weight)>0).sort((a,b)=>b[0].localeCompare(a[0]));return logs.length?Number(logs[0][1].weight):83}
function toggleHabit(d,id,v){if(!db.habits[d])db.habits[d]={};db.habits[d][id]=v;save();render()}
function habits(){let c=count(selected);let year=Number(month.slice(0,4)),m=Number(month.slice(5,7)),first=new Date(Date.UTC(year,m-1,1)).getUTCDay(),days=new Date(Date.UTC(year,m,0)).getUTCDate();let blank=(first+6)%7;let cells=Array.from({length:blank},()=>'<div></div>');for(let i=1;i<=days;i++){let d=`${year}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`;cells.push(`<button class="day ${selected===d?'selected':''} ${completion(d)>=75?'completed':''} ${inChallenge(d)?'':'off'}" data-day="${d}" ${!inChallenge(d)?'disabled':''}>${i}<span class="dot">${fast(d)?'☾ ':''}${completion(d)||''}${completion(d)?'%':''}</span></button>`)}document.getElementById('habits').innerHTML=`<h2 class="heading">Daily Habit Tracker</h2><p class="intro">Calaamadee caadooyinka aad dhab ahaan samaysay. Dhibco hoose ma aha guuldarro—waxaad dib u bilaabi kartaa maalinta xigta.</p><div class="section"><div class="card"><div class="between"><h3>${fmt(selected)} · Day ${dayNum(selected)}</h3><span class="tag">${completion(selected)}% completed</span></div><div class="progress"><span style="width:${completion(selected)}%"></span></div>${[...new Set(HABITS.map(h=>h[2]))].map(group=>`<h4 style="font-size:12px;color:var(--muted);margin:17px 0 3px">${group}</h4>${HABITS.filter(h=>h[2]===group).map(([id,label])=>`<div class="habit"><label><input type="checkbox" ${checked(selected,id)?'checked':''} onchange="toggleHabit('${selected}','${id}',this.checked)"><span>${label}</span></label></div>`).join('')}`).join('')}${fast(selected)?`<div class="habit"><label><input type="checkbox" ${checked(selected,'fast')?'checked':''} onchange="toggleHabit('${selected}','fast',this.checked)">Soonkii Isniin/Khamiis</label><span class="tag">Soon</span></div>`:''}<p class="mini">Caadada gaarka ah waxaad ku calaamadayn kartaa si gaar ah; lama wadaagayo cid kale, mana laga soo bandhigayo faahfaahin dashboard-ka.</p></div><div class="card"><div class="between"><button class="btn secondary" id="prevMonth">←</button><h3>${new Intl.DateTimeFormat('so-SO',{month:'long',year:'numeric',timeZone:'UTC'}).format(parseDay(month+'-15'))}</h3><button class="btn secondary" id="nextMonth">→</button></div><div class="calendar">${['Is','Ta','Ar','Kh','Ji','Sa','Ax'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div><div class="notice success">Isniin iyo Khamiis waa maalmaha soonka ee challenge-ka. Qorshaha wuxuu ka kooban yahay 26 maalmood oo soon ah.</div><div class="actions"><button class="btn outline" id="todayHabit">Maanta</button><button class="btn outline" id="prevDay">Maalintii hore</button><button class="btn outline" id="nextDay">Maalinta xigta</button></div></div></div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;habits()});document.getElementById('prevMonth').onclick=()=>changeMonth(-1);document.getElementById('nextMonth').onclick=()=>changeMonth(1);document.getElementById('todayHabit').onclick=()=>{selected=inChallenge(isoToday())?isoToday():START;month=selected.slice(0,7);habits()};document.getElementById('prevDay').onclick=()=>{if(selected>START){selected=plusDay(selected,-1);month=selected.slice(0,7);habits()}};document.getElementById('nextDay').onclick=()=>{if(selected<END){selected=plusDay(selected,1);month=selected.slice(0,7);habits()}}}

function finance(){let p=sum(db.payments),inc=sum(db.income),exp=sum(db.expenses);document.getElementById('finance').innerHTML=`<h2 class="heading">Financial & Debt Tracker</h2><p class="intro">Diiwaangeli lacagta dhab ahaan soo gasha iyo baxda. Ha samayn ballan dayn-bixin oo ka badan lacagta aad gacanta ku hayso.</p><div class="grid">${metric('Daynta bilowga',money(db.profile.openingDebt),'Input: $8,379')}${metric('La bixiyey',money(p),'Bixinaha aad diiwaangelisay')}${metric('Harsan',money(balance()),'Bilow minus payments')}${metric('Lacagta net',money(inc-exp-p),'Income − expenses − debt payments')}</div><div class="section equal"><div class="card"><h3>Diiwaangeli lacag</h3><p class="sub">Ku qor dakhliga, kharashka ama lacagta daynta aad bixisay.</p><form id="moneyForm"><div class="form-row"><div class="field"><label>Nooca</label><select class="control" name="kind"><option value="income">Dakhli</option><option value="expenses">Kharash</option><option value="payments">Dayn-bixin</option></select></div><div class="field"><label>USD</label><input class="control" name="amount" type="number" min="0.01" step="0.01" required></div></div><div class="form-row" style="margin-top:10px"><div class="field"><label>Taariikh</label><input class="control" name="date" type="date" value="${isoToday()}" required></div><div class="field"><label>Sharaxaad</label><input class="control" name="note" maxlength="180" placeholder="Source / recipient"></div></div><button class="btn" style="margin-top:12px">Kaydi transaction</button></form><div class="notice">Dakhliga aad sheegtay waa <b>$150 ka badan</b> oo aan joogto ahayn. Sidaas awgeed wax dakhli bil kasta ah si otomaatig ah uguma darno xisaabta.</div></div><div class="card"><h3>Debt prioritization</h3><p class="sub">Ku qor cidda kugu leh, lacagta, iyo rank. Qaybintani ma beddelayso daynta guud ee bilowga ilaa aad ku saxdo Settings.</p><form id="debtForm"><div class="form-row"><div class="field"><label>Cidda / magaca</label><input class="control" name="name" required placeholder="Creditor"></div><div class="field"><label>USD</label><input class="control" name="amount" required type="number" step="0.01" min="0.01"></div><div class="field"><label>Rank</label><select name="rank" class="control"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><button class="btn">Ku dar</button></div></form><p class="mini" style="margin-top:10px">A = degdeg/cawaaqib, B = dulsaar/kharash badan, C = heshiis muhiim ah, D = dabacsan. Xaqiiji heshiisyada.</p><div class="tablewrap"><table><thead><tr><th>Creditor</th><th>Rank</th><th>Amount</th><th></th></tr></thead><tbody>${db.debts.map((x,i)=>`<tr><td>${esc(x.name)}</td><td><span class="tag ${x.rank==='A'?'warn':''}">${x.rank}</span></td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="delDebt(${i})">×</button></td></tr>`).join('')||'<tr><td colspan="4">Weli lama gelin daymo gaar gaar ah.</td></tr>'}</tbody></table></div><p class="mini">Sum of listed creditors: ${money(sum(db.debts))}. Tani waa kala-qaybin, ma aha dayn lagu darayo $8,379.</p></div></div><div class="card" style="margin-top:16px"><h3>Transactions</h3><div class="tablewrap"><table><thead><tr><th>Taariikh</th><th>Nooc</th><th>Faahfaahin</th><th>USD</th><th></th></tr></thead><tbody>${['income','expenses','payments'].flatMap(kind=>db[kind].map((x,i)=>({...x,kind,i}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(x=>`<tr><td>${x.date}</td><td>${{income:'Dakhli',expenses:'Kharash',payments:'Dayn-bixin'}[x.kind]}</td><td>${esc(x.note)}</td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="delMoney('${x.kind}',${x.i})">×</button></td></tr>`).join('')||'<tr><td colspan="5">Weli lama gelin transactions.</td></tr>'}</tbody></table></div></div>`;document.getElementById('moneyForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),kind=d.get('kind'),amount=Number(d.get('amount'));if(!(amount>0))return toast('Geli lacag sax ah');if(kind==='payments'&&amount>balance())return toast('Dayn-bixintu kama badnaan karto daynta harsan.');db[kind].push({date:d.get('date'),amount,note:String(d.get('note')||'')});save();finance();toast('Transaction waa la kaydiyey.')};document.getElementById('debtForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);db.debts.push({name:String(d.get('name')).trim(),amount:Number(d.get('amount')),rank:d.get('rank')});save();finance();toast('Creditor waa la kaydiyey.')}}

function health(){let entries=Object.entries(db.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,20),bmi=(lastWeight()/Math.pow(Number(db.profile.height)/100,2)).toFixed(1);document.getElementById('health').innerHTML=`<h2 class="heading">Health, Fasting & Sleep</h2><p class="intro">Hadafku waa joogtaynta, ee ma aha gaajo, jimicsi xad-dhaaf ah ama inaad hurdo ku khasabto hal habeen.</p><div class="grid">${metric('Miisaanka bilowga','83 kg','12 November 2026')}${metric('Miisaanka hadda',lastWeight()+' kg','Cabbirka ugu dambeeyey')}${metric('BMI hadda',bmi,'Qiyaas, ma aha diagnosis')}${metric('Hadaf tixraac','79–80 kg','Dabacsan, aan khasab ahayn')}</div><div class="section"><div class="card"><h3>Daily health log</h3><p class="sub">Waqtiga hurdada waxaa loo diiwaangelin karaa si aad u aragto caadadaada hadda.</p><form id="healthForm"><div class="form-row"><div class="field"><label>Taariikh</label><input class="control" type="date" name="date" value="${inChallenge(isoToday())?isoToday():START}" required></div><div class="field"><label>Miisaan (kg), optional</label><input class="control" type="number" step="0.1" min="25" max="300" name="weight" placeholder="83.0"></div></div><div class="form-row" style="margin-top:10px"><div class="field"><label>Seexasho (saacadda)</label><input class="control" name="bed" type="time"></div><div class="field"><label>Toosid (saacadda)</label><input class="control" name="wake" type="time"></div><div class="field"><label>Saacado hurdo</label><input class="control" type="number" min="0" max="24" step="0.25" name="hours" placeholder="7.5"></div></div><div class="form-row" style="margin-top:10px"><div class="field"><label>Biyaha (koobab, optional)</label><input class="control" type="number" name="water" min="0" max="50" step="1"></div><div class="field"><label>Socod (daqiiqo, optional)</label><input class="control" type="number" name="walk" min="0" max="600" step="1"></div></div><button class="btn" style="margin-top:13px">Kaydi health log</button></form><div class="notice success">Hurdo: hadafku waa 7–9 saacadood. Soo hormari jadwalka 15–30 daqiiqo si tartiib ah marka aad ogaato saacadahaaga caadiga ah.</div><div class="notice">Testosterone: hoos-u-dhac lama xaqiijin. Caadooyinka shakhsiga ah keliya looma qaadan karo caddeyn testosterone hoose oo joogto ah. Haddii calaamado jiraan, kala tasho dhakhtar si baaritaan sax ah loo sameeyo.</div></div><div class="card"><h3>Log history</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Weight</th><th>Sleep</th><th>Water</th></tr></thead><tbody>${entries.map(([d,x])=>`<tr><td>${d}</td><td>${x.weight?`${x.weight} kg`:'—'}</td><td>${x.hours?`${x.hours} h`:'—'}</td><td>${x.water??'—'}</td></tr>`).join('')||'<tr><td colspan="4">Weli lama gelin health logs.</td></tr>'}</tbody></table></div><h3 style="margin-top:22px">Soonka Isniin & Khamiis</h3><p class="intro">26 maalmood guud ahaan. Suxuur iyo afur isku dheellitiran, biyo ku filan habeenkii, iyo jimicsi fudud maalinta soonka.</p><h3>Home workout</h3><p class="intro">Socod degdeg ah 20–30 min, 5 maalmood toddobaadkii. Squats, wall push-ups iyo plank 2–3 maalmood toddobaadkii, adigoo tartiib u kordhinaya.</p><h3>Food on a budget</h3><p class="intro">Ukun, digir, boorash, bariis qaddar dhexdhexaad ah, khudrad xilliyeed. Yaree cabbitaannada sonkorta leh, shiilan badan iyo cusbada xad-dhaafka ah. Ha mamnuucin dhammaan carbohydrates-ka.</p></div></div>`;document.getElementById('healthForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),date=d.get('date'),log={};for(let k of ['weight','bed','wake','hours','water','walk']){let v=d.get(k);if(v!=='')log[k]=['weight','hours','water','walk'].includes(k)?Number(v):v}if(Object.keys(log).length===0)return toast('Geli ugu yaraan hal cabbir.');db.logs[date]={...(db.logs[date]||{}),...log};save();health();toast('Health log waa la kaydiyey.')};}

function allSlots(){let ds=scheduleData(),base=baseSlots(selected);return [...base.map(x=>({...x,...(ds.overrides?.[x.id]||{})})),...ds.custom.map((x,i)=>({...x,id:x.id||'custom'+i}))].filter(x=>!ds.hidden?.[x.id]);}
function addSession(formId,type){let e=document.getElementById(formId);if(!e)return;let d=new FormData(e),start=d.get('start'),end=d.get('end'),title=String(d.get('title')||'').trim();if(!title||!Number.isFinite(parseClock(start))||!Number.isFinite(parseClock(end))||parseClock(end)<=parseClock(start))return toast('Geli hawl iyo bilow/dhammaad sax ah (isku maalin).');if(type==='slot'){let ds=scheduleData();ds.custom.push({id:'user'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),start,end,title,cat:d.get('cat')||'study'});}else{let key=type==='quran'?'quranSessions':'readingSessions';if(!Array.isArray(db[key]))db[key]=[];db[key].push({date:selected,start,end,title,type});}save();schedule();toast('Waqtiga waa la kaydiyey')}
function delSession(type,index){let key=type==='quran'?'quranSessions':'readingSessions';if(!confirm('Diiwaankan ma tirtiraysaa?'))return;db[key].splice(index,1);save();schedule()}
function delSlot(id){let ds=scheduleData();if(!ds.hidden)ds.hidden={};ds.hidden[id]=true;ds.custom=ds.custom.filter(x=>x.id!==id);save();schedule()}
function toggleSlot(id,v){let ds=scheduleData();ds.completed[id]=v;save();schedule()}
function prayerPanel(){let pd=prayerData();return `<div class="card"><h3>5-ta salaadood · ${fmt(selected)}</h3><p class="sub">Geli waqtiyada salaadda ee deegaankaaga maalintan. App-ku ma xisaabinayo adhaan times mana qiyaasayo. Diiwaangeli waqtiga aad dhab ahaan tukatay iyo meesha.</p><div class="praygrid">${PRAYERS.map(([id,label])=>{let p=pd[id]||{};return `<div class="prayercard"><h4>${label}</h4><div class="form-row"><div class="field"><label>Waqtiga salaadda (local)</label><input class="control" type="time" value="${esc(p.time||'')}" onchange="setPrayer('${id}','time',this.value)"></div><div class="field"><label>Waqtiga aad tukatay</label><input class="control" type="time" value="${esc(p.doneTime||'')}" onchange="setPrayer('${id}','doneTime',this.value)"></div></div><div class="form-row" style="margin-top:10px"><label class="checkline" style="font-size:12px"><input type="checkbox" ${p.done?'checked':''} onchange="setPrayer('${id}','done',this.checked)"> Waan tukaday</label><div class="field"><label>Meesha</label><select class="control" onchange="setPrayer('${id}','place',this.value)"><option value="">Dooro...</option>${[['jamaaco','Jamaaco / masaajid'],['home','Guriga'],['other','Meel kale']].map(([v,t])=>`<option value="${v}" ${p.place===v?'selected':''}>${t}</option>`).join('')}</select></div></div></div>`}).join('')}</div><p class="notehelp">Jamaaco iyo guriga waa hababka aad diiwaangelineyso; mar kasta meesha saxda ah dooro. Salaad waqtigeeda haysata lama qaadanayo inay la tukaday ilaa aad calaamadiso.</p></div>`}
function dhikrPanel(){let ad=adhkarData();return `<div class="card"><h3>Adhkaar, tasbiix iyo duco — mid mid</h3><p class="sub">Calaamadee waxaad akhriday; tirada aad dhab ahaan samaysay geli. Qoraallada dheer magacyadooda ayaa muuqda; ka akhri Mushafka ama kitaab adhkaar lagu kalsoon yahay.</p>${[['subax','Adhkaar subax'],['galab','Adhkaar galab'],['tasbiix','Tasbiix iyo dikri'],['duco','Ducooyin']].map(([g,label])=>`<h4 style="margin:20px 0 2px;color:var(--forest)">${label}</h4>${DHIKR.filter(x=>x[1]===g).map(([id,group,title,arabic,desc])=>{let v=ad[id]||{};return `<div class="dhikr-item"><label class="checkline"><input type="checkbox" ${v.done?'checked':''} onchange="setDhikr('${id}','done',this.checked)"><b>${title}</b></label><div class="arabic" lang="ar">${arabic}</div><p class="mini">${desc}</p><div class="field" style="max-width:160px"><label>Tirada aad akhriday</label><input class="control" type="number" min="0" max="10000" value="${v.count??''}" placeholder="0" onchange="setDhikr('${id}','count',this.value===''?'':Number(this.value))"></div></div>`}).join('')}`).join('')}</div>`}
function sessionsPanel(){return `<div class="card"><h3>Qur'aanka iyo akhriska — saacadihii dhabta ahaa</h3><p class="sub">Diiwaangeli bilowga iyo dhammaadka si app-ku u tuso inta daqiiqo aad akhrisay. Geli xizbi/juz ama cinwaanka buugga.</p>${[['quran','Qur’aan: juz/xizbi/suurad'],['reading','Buug / documentary / cashar']].map(([type,label])=>{let a=db[type==='quran'?'quranSessions':'readingSessions']||[],entries=a.map((x,i)=>({...x,index:i})).filter(x=>x.date===selected);let minutes=entries.reduce((s,x)=>s+parseClock(x.end)-parseClock(x.start),0);return `<h4>${label} <span class="tag">${Math.floor(minutes/60)}h ${minutes%60}m</span></h4><form id="${type}Form" class="form-row" onsubmit="event.preventDefault();addSession('${type}Form','${type}')"><div class="field"><label>Bilow</label><input class="control" name="start" type="time" required></div><div class="field"><label>Dhammaad</label><input class="control" name="end" type="time" required></div><div class="field" style="flex:2"><label>Waxaad akhriday</label><input class="control" name="title" placeholder="${type==='quran'?'Tusaale: Al-Baqarah 1 xizbi':'Tusaale: Survival Analysis Ch 2'}" required></div><button class="btn">Kaydi</button></form>${entries.map(x=>`<div class="timeline"><b>${x.start}–${x.end}</b><span style="flex:1">${esc(x.title)}</span><button class="btn danger" onclick="delSession('${type}',${x.index})">×</button></div>`).join('')||'<p class="mini">Weli wax lama diiwaangelin.</p>'}`}).join('')}</div>`}
function hoursPanel(){let ds=scheduleData(),slots=allSlots(),pd=prayerData();let timed=PRAYERS.filter(([id])=>pd[id]?.time).map(([id,title])=>({id:'prayer-'+id,start:pd[id].time,end:pd[id].time,title:'Salaadda '+title,cat:'prayer',prayer:true}));let sessionSlots=[...(db.quranSessions||[]).filter(x=>x.date===selected).map((x,i)=>({...x,id:'session-q-'+i,cat:'spiritual',recorded:true})),...(db.readingSessions||[]).filter(x=>x.date===selected).map((x,i)=>({...x,id:'session-r-'+i,cat:'study',recorded:true}))];let all=[...slots,...timed,...sessionSlots];let rows=Array.from({length:24},(_,h)=>{let items=all.filter(x=>{let a=parseClock(x.start),b=parseClock(x.end);return Number.isFinite(a)&&Math.floor(a/60)<=h&&(x.prayer?Math.floor(a/60)===h:(b>h*60||Math.floor(a/60)===h))}).sort((a,b)=>parseClock(a.start)-parseClock(b.start));return `<div class="hourrow"><div class="hourtime">${fmtHour(h)}</div><div>${items.length?items.map(x=>`<div class="slot ${x.cat||''}"><strong>${esc(x.start)}${x.end!==x.start?'–'+esc(x.end):''} · ${esc(x.title)}${Math.floor(parseClock(x.start)/60)<h?' (socota)':''}</strong>${x.prayer?'<small>Waqtiga aad adigu gelisay — xaqiiji jadwalka salaadda deegaanka</small>':''}${!x.prayer&&!x.recorded?`<div class="slot-controls"><label class="checkline"><input type="checkbox" ${ds.completed[x.id]?'checked':''} onchange="toggleSlot('${x.id}',this.checked)"> La qabtay</label><button class="btn outline" onclick="delSlot('${x.id}')">Ka saar maanta</button></div>`:''}</div>`).join(''):'<div class="emptyhour">— Waqti bannaan / hawl aan la qorshayn</div>'}</div></div>`}).join('');return `<div class="card"><div class="between"><h3>24-saac Jadwal · ${fmt(selected)}</h3><span class="tag">00:00–23:59</span></div><p class="sub">Jadwalkani waa tusaale la beddeli karo. Waqtiyada salaadda ee aan la gelin ma muuqdaan timeline-ka; ku qor qaybta Salaadaha. Waxaa la muujinayaa hawsha iyo saacadda bilowga, dhammaadka iyo in la qabtay.</p>${rows}<h3 style="margin-top:21px">Ku dar hawl iyo waqtigeeda</h3><form id="slotForm" class="form-row" onsubmit="event.preventDefault();addSession('slotForm','slot')"><div class="field"><label>Bilow</label><input class="control" name="start" type="time" required></div><div class="field"><label>Dhammaad</label><input class="control" name="end" type="time" required></div><div class="field" style="flex:2"><label>Hawl</label><input class="control" name="title" placeholder="Tusaale: Revision Regression" required></div><div class="field"><label>Nooca</label><select class="control" name="cat"><option value="study">Waxbarasho</option><option value="spiritual">Cibaado</option><option value="health">Caafimaad</option><option value="sleep">Hurdo</option></select></div><button class="btn">Ku dar</button></form><p class="notehelp">Hawlaha ay waqtigoodu isku beegmaan way wada muuqanayaan. Ka saar qorshaha aan kugu habboonayn oo ku dar jadwalkaaga gaarka ah. Habeen-hurdo dhex martay saqda dhexe waxay u baahan kartaa laba qaybood oo maalmo kala duwan ah.</p></div>`}
function schedule(){let el=document.getElementById('schedule');if(!el)return;el.innerHTML=`<h2 class="heading">Jadwalka Saacad-saacad & Cibaadada</h2><p class="intro">Dooro maalin kasta, eeg 24-ka saacadood, shanta salaadood, adhkaarta iyo waqtiga Qur'aanka/akhriska. Xogta oo dhan si gaar ah ayaa maalinta loogu kaydiyaa.</p><div class="toolbar"><label>Taariikhda</label><input type="date" class="control" min="${START}" max="${END}" value="${selected}" onchange="changeScheduleDate(this.value)"><button class="btn secondary" onclick="changeScheduleDate('${inChallenge(isoToday())?isoToday():START}')">Maanta</button><span class="tag ${fast(selected)?'warn':''}">${fast(selected)?'☾ Soon Isniin/Khamiis':'Maalin caadi ah'}</span></div><div class="notice">Waqtiyada adhaanka ma aha kuwo si otomaatig ah loo xisaabiyey. Ku geli xogta salaadaha ee deegaankaaga (Borama/Hargeysa ama meesha aad joogto). Waqtiga tusaalaha ee jadwalka looma qaadan karo waqtiga salaadda. Isniin 16:00–19:00 fasal iyo soon ayaa isku beegmi kara.</div><div class="section equal"><div>${prayerPanel()}</div><div>${sessionsPanel()}</div></div><div class="section equal"><div>${dhikrPanel()}</div><div>${hoursPanel()}</div></div>`}


let n90Unlocked=false;
const N90_MESSAGES=['Alxamdulillaah — Maanta waa tallaabo wanaagsan.','Masha Allah. Sii wad, hal maalin mar.','Tabaarak Ar-Raxmaan — Ku farax horumarkaaga.','Niyad adag iyo samir. Berri waa fursad cusub.','Alxamdulillaah, waxaad dhisaysaa joogtayn.','Sii wad! Horumar yar oo joogto ahi waa guul.'];
function n90Hash(s){let v=2166136261;for(let i=0;i<s.length;i++){v^=s.charCodeAt(i);v=Math.imul(v,16777619)}return (v>>>0).toString(16)}
function n90Setup(){let one=document.getElementById('n90-new')?.value||'',two=document.getElementById('n90-confirm')?.value||'';if(!/^\d{4,8}$/.test(one))return toast('PIN: 4–8 lambar.');if(one!==two)return toast('PIN-yadu ma is waafaqaan.');db.n90PinHash=n90Hash(one);save();n90Unlocked=true;n90();toast('N90 waa diyaar. Kaydi PIN-kaaga.');}
function n90Unlock(){let pin=document.getElementById('n90-pin')?.value||'';if(n90Hash(pin)!==db.n90PinHash)return toast('PIN ma saxna');n90Unlocked=true;n90()}
function n90Lock(){n90Unlocked=false;n90()}
function n90Tick(d,on){if(!db.n90)db.n90={};db.n90[d]=on;save();n90()}
function n90(){let el=document.getElementById('n90');if(!el)return;
 if(!db.n90PinHash){el.innerHTML=`<h2 class="heading">N90 · Private</h2><div class="card"><h3>Deji PIN kuu gaar ah</h3><p class="sub">Qaybtani waxay leedahay magac kooban oo aan hawsha shaacin. PIN-ku waa quful muuqaal oo keliya; xogta browser-ka laguma sirayn.</p><div class="form-row"><div class="field"><label>PIN (4–8 digits)</label><input class="control" id="n90-new" type="password" inputmode="numeric" autocomplete="new-password"></div><div class="field"><label>Ku celi PIN</label><input class="control" id="n90-confirm" type="password" inputmode="numeric" autocomplete="new-password"></div></div><button class="btn" onclick="n90Setup()">Deji PIN</button></div>`;return}
 if(!n90Unlocked){el.innerHTML=`<h2 class="heading">N90 · Private</h2><div class="card"><h3>Fur diiwaankaaga</h3><p class="sub">Fur PIN-kaaga gaarka ah.</p><div class="field" style="max-width:250px"><label>PIN</label><input class="control" id="n90-pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')n90Unlock()"></div><button class="btn" onclick="n90Unlock()">Unlock</button></div>`;return}
 let entries=db.n90||{},successful=Object.values(entries).filter(Boolean).length,streak=0;for(let i=TOTAL-1;i>=0;i--){let d=plusDay(START,i);if(d>isoToday())continue;if(entries[d]){streak++;break}if(entries[d]===false)break}let i=dayNum(selected),msg=N90_MESSAGES[((i-1)%N90_MESSAGES.length+N90_MESSAGES.length)%N90_MESSAGES.length];let all=Array.from({length:TOTAL},(_,i)=>{let d=plusDay(START,i),done=!!entries[d];return `<button type="button" class="n90day ${done?'selected':''}" onclick="n90Tick('${d}',${!done})" aria-label="Day ${i+1}: ${done?'completed':'not completed'}"><b>${i+1}</b><small>${done?'✓':'○'}</small></button>`}).join('');el.innerHTML=`<div class="between"><h2 class="heading">N90 · 90-Day Focus</h2><button class="btn secondary" onclick="n90Lock()">🔒 Lock</button></div><p class="intro">Diiwaankan waa mid gaar ah. Guji maalinta aad gaadhay si aad u calaamadiso.</p><div class="grid"><div class="card"><p class="sub">Days completed</p><h2>${successful}/90</h2></div><div class="card"><p class="sub">Maanta la doortay</p><h2>Day ${Math.max(1,Math.min(TOTAL,i))}</h2></div></div><div class="card"><h3>Day ${Math.max(1,Math.min(TOTAL,i))} · ${fmt(selected)}</h3><label class="checkline"><input type="checkbox" ${entries[selected]?'checked':''} onchange="n90Tick('${selected}',this.checked)"> Waan dhammeeyey maanta</label><p class="notice">${entries[selected]?msg:'Alxamdulillaah — Hal maalin mar. Maanta bilow, is-dhiibidna ha samayn.'}</p><h3>90-ka maalmood</h3><div class="n90grid">${all}</div><p class="notehelp">Ku noqoshada caado hore ma tirtirayso horumarkii hore. PIN-kan ma aha encryption; ka fogow qalab dad kale wada isticmaalaan, oo ilaali backup-ka JSON.</p></div>`;
}
function settings(){document.getElementById('settings').innerHTML=`<h2 class="heading">Settings & Data Privacy</h2><p class="intro">App-kani wuxuu xogta ku kaydiyaa browser-kaaga oo keliya. Ma laha cloud login ama sync, sidaas darteed kaydi backup JSON si aan xogtu kuugu lumin.</p><div class="section equal"><div class="card"><h3>Baseline settings</h3><form id="settingsForm" class="form-row"><div class="field"><label>Miisaanka bilowga (kg)</label><input class="control" name="weight" type="number" step="0.1" value="${esc(db.profile.weight)}" readonly></div><div class="field"><label>Da'da</label><input class="control" name="age" type="number" value="${db.profile.age}" readonly></div><div class="field"><label>Dhererka (cm)</label><input class="control" name="height" type="number" value="${db.profile.height}" readonly></div><div class="field"><label>Daynta bilowga (USD)</label><input class="control" name="openingDebt" type="number" step="0.01" min="0" value="${db.profile.openingDebt}"></div><div style="width:100%"><button class="btn">Update debt baseline</button></div></form><p class="mini">Bilowga $8,379 waxaa la beddeli karaa oo keliya haddii aad xaqiijiso in total-ku khaldan yahay. Transactions-kana waa laga jarayaa.</p></div><div class="card"><h3>Backup / Restore</h3><p class="privacy">Export: wuxuu sameeyaa JSON file ay ku jiraan caadooyinkaaga gaarka ah iyo daymaha. Si taxaddar leh u kaydi. Import wuxuu beddelaa xogta hadda ku jirta app-ka.</p><div class="actions"><button class="btn" onclick="exportData()">⬇ Download backup</button><button class="btn outline" id="restoreBtn">⬆ Restore backup</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><h3>Reset</h3><p class="mini">Waxay tiraysaa dhammaan xogta aad gelisay qalabkan. Marka hore samee backup.</p><button class="btn danger" onclick="resetData()">Delete my local data</button></div></div><div class="card" style="margin-top:16px"><h3>App installation</h3><p class="privacy"><b>Android:</b> Chrome → menu → Install app / Add to Home screen. <b>iPhone:</b> Safari → Share → Add to Home Screen. <b>Computer:</b> Chrome/Edge → Install icon. PWA installation iyo offline shaqayntu waxay u baahan yihiin HTTPS (ama localhost), ma aha file si toos ah loo furay.</p><button class="btn secondary" id="installBtn" style="display:none">Install My 90 Days</button><p class="privacy">Offline: markii la booqdo site-ka HTTPS iyadoo internet jiro, app shell-ka wuu kaydsan karaa; xogta gelinta waxay ku kaydsan tahay localStorage qalabkaas. Browser data clearing ama device loss waxay tirtiri kartaa.</p></div>`;document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),v=Number(d.get('openingDebt'));if(!Number.isFinite(v)||v<sum(db.payments))return toast('Daynta bilowga kama yaraan karto lacagta hore loo bixiyey.');db.profile.openingDebt=v;save();render();toast('Debt baseline updated.')};document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=restore; if(window.deferredInstallPrompt){let b=document.getElementById('installBtn');b.style.display='block';b.onclick=async()=>{window.deferredInstallPrompt.prompt();await window.deferredInstallPrompt.userChoice;window.deferredInstallPrompt=null;b.style.display='none'}}}
function exportData(){let data=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download='my90days-backup-'+isoToday()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup JSON waa la soo dejiyey. Ilaali xogtiisa.')}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.version!==1||typeof obj.habits!=='object'||!Array.isArray(obj.payments)||!obj.profile)throw new Error('invalid');if(!confirm('Backup-kani wuxuu beddelayaa xogta hadda ku jirta. Ma sii waddaa?'))return;db={...stateDefault(),...obj};save();render();toast('Backup restored.')}catch(e){toast('Backup-ka lama aqoonsan.')}}
function resetData(){if(!confirm('Ma hubtaa inaad tirtirto dhammaan xogta local-ka?'))return;if(!confirm('Tani dib looma soo celin karo haddii aadan haysan backup.'))return;db=stateDefault();save();show('dashboard');toast('Xogta local-ka waa la tirtiray.')}
function render(){document.getElementById('topDate').textContent=fmt(isoToday());({dashboard,habits,schedule,study,finance,health,n90,settings})[active]();nav()}
window.show=show;window.n90=n90;window.n90Setup=n90Setup;window.n90Unlock=n90Unlock;window.n90Lock=n90Lock;window.n90Tick=n90Tick;window.schedule=schedule;window.setPrayer=setPrayer;window.setDhikr=setDhikr;window.addSession=addSession;window.delSession=delSession;window.delSlot=delSlot;window.toggleSlot=toggleSlot;window.changeScheduleDate=changeScheduleDate;window.toggleHabit=toggleHabit;window.toggleStudy=toggleStudy;window.delEvent=delEvent;window.delMoney=delMoney;window.delDebt=delDebt;window.exportData=exportData;window.resetData=resetData;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstallPrompt=e;if(active==='settings')settings()});if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
selected=inChallenge(isoToday())?isoToday():START;month=selected.slice(0,7);render();
</script>
</body></html>
